name: Refresh committed frontend

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend-dist.yml

permissions:
  contents: write

concurrency:
  group: frontend-dist-main
  cancel-in-progress: true

jobs:
  build:
    # A commit made by this workflow contains only dist and must not rebuild it.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build committed frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build:release
      - name: Commit changed build
        run: |
          if git diff --quiet -- frontend/dist; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/dist
          git commit -m "rebuild frontend"
          git push
