<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dsl</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/icon.svg') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32x32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='icons/site.webmanifest') }}">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "@codemirror/state": "https://esm.sh/*@codemirror/state@6.7.6",
      "@codemirror/view": "https://esm.sh/*@codemirror/view@6.43.14",
      "@codemirror/language": "https://esm.sh/*@codemirror/language@6.13.1",
      "@codemirror/streamparser": "https://esm.sh/@codemirror/streamparser@6.0.0",
      "@codemirror/commands": "https://esm.sh/*@codemirror/commands@6.11.1",
      "@codemirror/lint": "https://esm.sh/*@codemirror/lint@6.9.7",
      "@lezer/common": "https://esm.sh/@lezer/common@1.5.3",
      "@lezer/highlight": "https://esm.sh/*@lezer/highlight@1.2.5",
      "@marijn/find-cluster-break": "https://esm.sh/@marijn/find-cluster-break@1.0.4",
      "style-mod": "https://esm.sh/style-mod@4.1.4",
      "crelt": "https://esm.sh/crelt@1.0.7",
      "w3c-keyname": "https://esm.sh/w3c-keyname@2.2.8"
    }
  }
  </script>
  <style>
    /* item language tokens, shared by the editor and the list */
    .tok-primary { color: var(--color-primary); font-weight: 600; }
    .tok-property, .tok-relation { color: var(--color-accent); font-weight: 600; }
    .tok-modifier, .tok-state { color: var(--color-secondary); font-weight: 600; }
    .tok-option { color: var(--color-accent); }
    .tok-date, .tok-month, .tok-path, .tok-text, .tok-target { color: var(--color-info); }
    .tok-weekday { color: var(--color-success); }
    .tok-extra { color: color-mix(in oklab, var(--color-base-content) 70%, transparent); }
    .tok-unknown { color: color-mix(in oklab, var(--color-base-content) 50%, transparent); font-style: italic; }
    .tok-error { text-decoration: underline wavy var(--color-error); }
    /* the list: one base size per row, every part sized relative to it */
    .overview { font-size: 0.875rem; line-height: 1.5; overflow-wrap: anywhere; }
    .overview > * + * { margin-top: 0.4em; }
    .ov-section > * + * { margin-top: 0.15em; }
    .ov-muted { color: color-mix(in oklab, var(--color-base-content) 60%, transparent); }
    .ov-missing { text-decoration: line-through; color: color-mix(in oklab, var(--color-base-content) 50%, transparent); }
    /* monospace only for keyword lines; it runs wide, so a bit smaller */
    .ov-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; white-space: pre-wrap; }
    .ov-extra { font-size: 0.9em; color: color-mix(in oklab, var(--color-base-content) 70%, transparent); }
    .md > * + * { margin-top: 0.4em; }
    .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-size: 1em; font-weight: 600; }
    .md ul { list-style: disc; padding-left: 1.25rem; }
    .md ol { list-style: decimal; padding-left: 1.25rem; }
    .md a { text-decoration: underline; }
    .md code, .md pre { font-family: inherit; font-size: 1em; background: var(--color-base-300); border-radius: 0.25rem; padding: 0 0.2em; }
    .md pre { white-space: pre-wrap; padding: 0.4em 0.6em; }
    .md pre code { padding: 0; }
    .md blockquote { border-left: 2px solid var(--color-base-300); padding-left: 0.75rem; }
  </style>
</head>
<body>
  <div id="app" class="max-w-5xl mx-auto p-4"></div>
  <script type="module" src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
