[project]
name = "dsl-crud"
version = "0.1.0"
description = "Edit dsl item files (as read by ../calendar) in a folder on disk"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bibtexparser>=2.0.1",
    "flask>=3.1.3",
    "markdown-it-py>=4.2.0",
    "numpy>=2.5.4",
    "pylatexenc>=2.11",
    "pyyaml>=6.0.3",
    "regex>=2026.9.29",
]

[dependency-groups]
cards = [
    "pillow>=13.0.0",
    "playwright>=1.64.1",
]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
# `cards`: the portfolio's card collages (collage.py); left out on Termux, which only installs `dependencies`
default-groups = ["dev", "cards"]

[tool.pytest.ini_options]
pythonpath = ["."]
