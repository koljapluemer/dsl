[project]
name = "dsl-crud"
version = "0.1.0"
description = "Edit dsl item files (as read by ../calendar) in a folder on disk"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
